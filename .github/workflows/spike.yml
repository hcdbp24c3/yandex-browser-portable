name: Spike

# Task 0 spike for yandex-browser-portable (helium issue #8).
# Answers four questions on a real windows-latest runner and emits EXACTLY
# FOUR machine-readable verdict lines, one per probe, in this format:
#   P<n> verdict: PASS|FAIL|HONORED|IGNORED|FALLBACK - <details>
# (P1/P4 = PASS|FAIL, P2 = PASS|FALLBACK, P3 = HONORED|IGNORED)
# Sub-probes (P3a, P2b, P3b) only emit "detail: ..." lines so they can never
# collide with the grep used to count verdict lines.
#
# pwsh authoring rules honored here: no backtick-escaped quotes inside
# double-quoted strings, no '#' inside step names, no '${{' interpolation
# inside run bodies, verdict/detail lines are also written with Write-Host so
# they are scrapeable from the job log.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        id: prep
        if: always()
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'spike'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($sub in @('pkg', 'profiles')) {
            New-Item -ItemType Directory -Force -Path (Join-Path $dir $sub) | Out-Null
          }
          Add-Content -Path $env:GITHUB_ENV -Value "SPIKE=$dir" -Encoding utf8
          $probe = Join-Path (Get-Location).Path 'probe\eme-probe.html'
          Add-Content -Path $env:GITHUB_ENV -Value "PROBE=$probe" -Encoding utf8
          $seven = Get-Command 7z -ErrorAction SilentlyContinue
          if ($seven) {
            Add-Content -Path $env:GITHUB_ENV -Value "SEVENZIP=$($seven.Source)" -Encoding utf8
            Write-Host "7z at $($seven.Source)"
          } else {
            $dst = Join-Path $dir '7zr.exe'
            curl.exe -fsSL -o $dst https://www.7-zip.org/a/7zr.exe
            Write-Host "7zr download exit=$LASTEXITCODE"
            Add-Content -Path $env:GITHUB_ENV -Value "SEVENZIP=$dst" -Encoding utf8
          }
          Write-Host "workspace=$dir"
          exit 0

      - name: P1 extract winget installer
        id: p1
        if: always()
        run: |
          if (-not $env:SPIKE) { $env:SPIKE = Join-Path $env:RUNNER_TEMP 'spike'; New-Item -ItemType Directory -Force -Path $env:SPIKE | Out-Null }
          if (-not $env:SEVENZIP) { $env:SEVENZIP = '7z' }
          function EmitVerdict([string]$id, [string]$v) {
            $line = "$id verdict: $v"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'verdicts.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          function EmitDetail([string]$m) {
            $line = "detail: $m"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'details.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          $v = 'FAIL - probe did not run'
          try {
            $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
            $list = Invoke-RestMethod -Headers $h -Uri 'https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/y/Yandex/Browser' -TimeoutSec 30
            $names = @($list | ForEach-Object { $_.name })
            if ($names.Count -eq 0) { throw 'winget manifest listing is empty' }
            $latest = $names | Sort-Object { try { [version]$_ } catch { [version]'0.0.0.0' } } | Select-Object -Last 1
            EmitDetail "winget manifests: $($names.Count) entries; latest=$latest"

            $mfUrl = "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/y/Yandex/Browser/$latest/Yandex.Browser.installer.yaml"
            $mf = (Invoke-WebRequest -Uri $mfUrl -UseBasicParsing -TimeoutSec 30).Content
            $pkgVer = $latest
            if ($mf -match 'PackageVersion:\s*(\S+)') { $pkgVer = $Matches[1] }
            $urls = @([regex]::Matches($mf, '(?m)^\s*InstallerUrl:\s*(\S+)') | ForEach-Object { $_.Groups[1].Value })
            $installerUrl = @($urls | Where-Object { $_ -match 'download\.cdn\.yandex\.net' })[0]
            if (-not $installerUrl) { $installerUrl = @($urls)[0] }
            if (-not $installerUrl) { throw 'no InstallerUrl found in winget manifest' }
            EmitDetail "PackageVersion=$pkgVer; InstallerUrl=$installerUrl"

            $exe = Join-Path $env:SPIKE 'Yandex.exe'
            curl.exe -fsSL --retry 3 --retry-delay 2 -o $exe $installerUrl
            if ($LASTEXITCODE -ne 0) { throw "installer download failed curl exit=$LASTEXITCODE" }
            $size = (Get-Item $exe).Length
            EmitDetail "Yandex.exe bytes=$size"

            # branch A: treat the installer itself as a 7z payload (nested 7z too)
            $stageA = Join-Path $env:SPIKE 'extractA'
            New-Item -ItemType Directory -Force -Path $stageA | Out-Null
            $listOut = & $env:SEVENZIP l $exe | Out-String
            $isArchive = ($LASTEXITCODE -eq 0) -and ($listOut -match 'Type =')
            EmitDetail "branch A probe: 7z list exit=$LASTEXITCODE isArchive=$isArchive"
            $appRoot = ''
            if ($isArchive) {
              $null = & $env:SEVENZIP x $exe "-o$stageA" -y
              EmitDetail "branch A extract exit=$LASTEXITCODE"
              $seen = @()
              for ($lvl = 0; $lvl -lt 3; $lvl++) {
                $archives = @(Get-ChildItem -Path $stageA -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.7z', '.zip', '.rar' })
                $fresh = @($archives | Where-Object { $_.FullName -notin $seen })
                if ($fresh.Count -eq 0) { break }
                foreach ($a in $fresh) {
                  $seen += $a.FullName
                  $dest = Join-Path $a.DirectoryName ('x_' + $a.BaseName)
                  New-Item -ItemType Directory -Force -Path $dest | Out-Null
                  $null = & $env:SEVENZIP x $a.FullName "-o$dest" -y
                  EmitDetail "nested archive $($a.Name) extract exit=$LASTEXITCODE"
                }
              }
              $be = Get-ChildItem -Path $stageA -Recurse -File -Filter 'browser.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($be) { $branch = 'A (7z payload extract)'; $appRoot = $be.Directory.FullName }
            }

            # branch B: silent install then harvest the versioned Application dir
            if (-not $appRoot) {
              EmitDetail 'branch A yielded no browser.exe; running branch B (silent install harvest)'
              $ip = Start-Process -FilePath $exe -ArgumentList '--silent', '--do-not-launch-browser' -PassThru -NoNewWindow
              if (-not $ip.WaitForExit(600000)) { $ip.Kill($true); throw 'branch B silent install timed out after 600s' }
              EmitDetail "branch B install exit=$($ip.ExitCode) (winget success codes are 1 and 3)"
              $branch = 'B (silent install harvest)'
              $appBase = Join-Path $env:LOCALAPPDATA 'Yandex\YandexBrowser\Application'
              if (-not (Test-Path $appBase)) { throw "branch B: missing $appBase" }
              $bes = @(Get-ChildItem -Path $appBase -Recurse -File -Filter 'browser.exe' -ErrorAction SilentlyContinue)
              if ($bes.Count -eq 0) { throw "branch B: no browser.exe under $appBase" }
              $be = $bes | Sort-Object { try { [version]$_.Directory.Name } catch { [version]'0.0.0.0' } } | Select-Object -Last 1
              $appRoot = $be.Directory.FullName
            }
            EmitDetail "extracted app root: $appRoot"

            # flat-layout candidate: copy the app tree into pkg\Yandex
            $pkgApp = Join-Path $env:SPIKE 'pkg\Yandex'
            New-Item -ItemType Directory -Force -Path $pkgApp | Out-Null
            Copy-Item -Path (Join-Path $appRoot '*') -Destination $pkgApp -Recurse -Force
            if (-not (Test-Path (Join-Path $pkgApp 'browser.exe'))) { throw 'browser.exe missing after layout copy' }

            # WidevineCdm hunt: inside the app dir, and up two parent levels
            $cdmHits = @()
            foreach ($r in @($appRoot, (Split-Path -Parent $appRoot), (Split-Path -Parent (Split-Path -Parent $appRoot)))) {
              if ($r -and (Test-Path $r)) {
                $cdmHits += @(Get-ChildItem -Path $r -Recurse -Directory -Filter 'WidevineCdm' -ErrorAction SilentlyContinue)
              }
            }
            $cdmHits = @($cdmHits | Sort-Object FullName -Unique)
            $cdmLoc = 'ABSENT'
            if ($cdmHits.Count -gt 0) { $cdmLoc = ($cdmHits | ForEach-Object { $_.FullName }) -join ' | ' }
            $pkgCdm = Test-Path (Join-Path $pkgApp 'WidevineCdm')
            $nested = @($cdmHits | Where-Object { $_.FullName.StartsWith($pkgApp) } | ForEach-Object { $_.FullName.Substring($pkgApp.Length) })
            if (-not $pkgCdm -and $cdmHits.Count -gt 0) {
              Add-Content -Path $env:GITHUB_ENV -Value "CDM_SRC=$($cdmHits[0].FullName)" -Encoding utf8
              EmitDetail "WidevineCdm not inside app dir; export CDM_SRC=$($cdmHits[0].FullName) for the P4 flat copy"
            }

            $entries = @(Get-ChildItem -Path $pkgApp -Force | ForEach-Object { if ($_.PSIsContainer) { $_.Name + '/' } else { $_.Name } })
            $tree = $entries -join ', '
            $treeShort = $tree
            if ($treeShort.Length -gt 600) { $treeShort = $treeShort.Substring(0, 600) + '...' }
            $flags = @(
              "browser.exe=$(Test-Path (Join-Path $pkgApp 'browser.exe'))"
              "version.dll=$(Test-Path (Join-Path $pkgApp 'version.dll'))"
              "service_update.exe=$(Test-Path (Join-Path $pkgApp 'service_update.exe'))"
              "yupdate-exec.exe=$(Test-Path (Join-Path $pkgApp 'yupdate-exec.exe'))"
              "Installer=$(Test-Path (Join-Path $pkgApp 'Installer'))"
              "WidevineCdm(appdir)=$pkgCdm"
              "nestedCdm=$($nested -join ',')"
            ) -join ' '
            EmitDetail "top-level tree: $tree"
            EmitDetail "flags: $flags"
            EmitDetail "WidevineCdm source location: $cdmLoc"
            EmitDetail "version.txt candidate (winget PackageVersion)=$pkgVer; source dir name=$(Split-Path -Leaf $appRoot)"

            $v = "PASS - branch=$branch; version=$pkgVer; WidevineCdm=$cdmLoc; tree=$treeShort"
          } catch {
            $v = "FAIL - $($_.Exception.Message)"
          }
          EmitVerdict 'P1' $v
          exit 0

      - name: P0 runtime diagnostics
        id: p0
        if: always()
        run: |
          if (-not $env:SPIKE) { $env:SPIKE = Join-Path $env:RUNNER_TEMP 'spike'; New-Item -ItemType Directory -Force -Path $env:SPIKE | Out-Null }
          function EmitDetail([string]$m) {
            $line = "detail: $m"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'details.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          # env contract defaults; later GITHUB_ENV writes below override these
          Add-Content -Path $env:GITHUB_ENV -Value 'DUMP_BASE=--headless=new --disable-gpu --no-first-run --no-default-browser-check --disable-crash-reporter --enable-logging=stderr --v=1' -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value 'P0_CDP=skip' -Encoding utf8
          $heliumBase = @('--headless=new', '--disable-gpu', '--no-first-run', '--no-default-browser-check', '--disable-crash-reporter', '--enable-logging=stderr', '--v=1')
          $plainBase = @('--headless', '--no-first-run', '--no-default-browser-check', '--disable-crash-reporter')
          function Get-Head([string]$path, [int]$lines, [int]$max) {
            $s = ''
            if (Test-Path $path) { $s = (@(Get-Content $path -TotalCount $lines -ErrorAction SilentlyContinue) -join ' | ') -replace '\s+', ' ' }
            if ($s.Length -gt $max) { $s = $s.Substring(0, $max) }
            return $s
          }
          function Get-Tail([string]$path, [int]$lines, [int]$max) {
            $s = ''
            if (Test-Path $path) { $all = @(Get-Content $path -ErrorAction SilentlyContinue); $s = (@($all | Select-Object -Last $lines) -join ' | ') -replace '\s+', ' ' }
            if ($s.Length -gt $max) { $s = $s.Substring(0, $max) }
            return $s
          }
          function Get-Tree {
            $p = @(Get-CimInstance Win32_Process -Filter 'Name="browser.exe" OR Name="browser_proxy.exe"' -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name):pid=$($_.ProcessId):pp=$($_.ParentProcessId)" })
            return ($p -join ', ')
          }
          try {
            $app = Join-Path $env:SPIKE 'pkg\Yandex'
            $exe = Join-Path $app 'browser.exe'
            if (-not (Test-Path $exe)) { throw 'browser.exe missing (P1 did not produce a tree)' }
            $dir = Split-Path -Parent $exe
            EmitDetail "P0 payload: browser.dll next to exe=$(Test-Path (Join-Path $app 'browser.dll')); in version dir=$(Test-Path (Join-Path $app '26.8.4.893\browser.dll'))"

            $vo = Join-Path $env:SPIKE 'p0-version-out.txt'
            $ve = Join-Path $env:SPIKE 'p0-version-err.txt'
            $vp = Start-Process -FilePath $exe -ArgumentList @('--version') -PassThru -NoNewWindow -WorkingDirectory $dir -RedirectStandardOutput $vo -RedirectStandardError $ve
            $vExit = 'running'
            if (-not $vp.WaitForExit(15000)) {
              try { $vp.Kill($true) } catch { EmitDetail "P0 --version kill: $($_.Exception.Message)" }
              $null = $vp.WaitForExit(3000); $vExit = 'killed@15s'
            } else { $vExit = $vp.ExitCode }
            Stop-Process -Name browser, browser_proxy -Force -ErrorAction SilentlyContinue
            EmitDetail "P0 --version exit=$vExit out=[$(Get-Head $vo 5 300)] err=[$(Get-Head $ve 5 300)]"

            function Invoke-Trial([string]$tag, [string[]]$base, [int]$budgetMs) {
              $o = Join-Path $env:SPIKE "p0-$tag-out.txt"
              $e2 = Join-Path $env:SPIKE "p0-$tag-err.txt"
              $prof = Join-Path $env:SPIKE "profiles\p0-$tag"
              $argList = $base + @("--user-data-dir=$prof", '--dump-dom', 'about:blank')
              $pr = $null
              try {
                $pr = Start-Process -FilePath $exe -ArgumentList $argList -PassThru -NoNewWindow -WorkingDirectory $dir -RedirectStandardOutput $o -RedirectStandardError $e2
              } catch {
                EmitDetail "P0 $tag start failed: $($_.Exception.Message)"
                return -1
              }
              Start-Sleep -Seconds 6
              EmitDetail "P0 $tag t+6s tree=[$(Get-Tree)]"
              $mw = @(Get-Process -Name browser -ErrorAction SilentlyContinue | ForEach-Object { "pid=$($_.Id):window=[$($_.MainWindowTitle)]" })
              EmitDetail "P0 $tag t+6s windows=[$($mw -join ', ')]"
              Start-Sleep -Seconds 14
              EmitDetail "P0 $tag t+20s tree=[$(Get-Tree)]"
              $ec = 'running'
              if (-not $pr.WaitForExit($budgetMs)) {
                try { $pr.Kill($true) } catch { EmitDetail "P0 $tag kill: $($_.Exception.Message)" }
                $null = $pr.WaitForExit(5000); $ec = "killed@${budgetMs}ms"
              } else { $ec = $pr.ExitCode }
              Stop-Process -Name browser, browser_proxy -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 1
              $len = -1
              $errBytes = -1
              if (Test-Path $o) { $len = (Get-Item $o).Length }
              if (Test-Path $e2) { $errBytes = (Get-Item $e2).Length }
              EmitDetail "P0 $tag exit=$ec outBytes=$len errBytes=$errBytes"
              EmitDetail "P0 $tag stderr head=[$(Get-Head $e2 8 600)]"
              EmitDetail "P0 $tag stderr tail=[$(Get-Tail $e2 15 900)]"
              return $len
            }

            $chosen = '--headless=new --disable-gpu --no-first-run --no-default-browser-check --disable-crash-reporter --enable-logging=stderr --v=1'
            $bHelium = Invoke-Trial 'helium-base' $heliumBase 30000
            $bPlain = -1
            if ($bHelium -le 200) { $bPlain = Invoke-Trial 'plain-base' $plainBase 30000 }
            if (($bHelium -le 200) -and ($bPlain -gt 200)) {
              $chosen = '--headless --no-first-run --no-default-browser-check --disable-crash-reporter'
              EmitDetail 'P0 plain base produced dump output; DUMP_BASE switched to plain'
            } elseif (($bHelium -le 200) -and ($bPlain -le 200)) {
              $timeoutBase = @($heliumBase) + @('--timeout=15000')
              $bTimeout = Invoke-Trial 'helium-timeout' $timeoutBase 30000
              if ($bTimeout -gt 200) {
                $chosen = '--headless=new --disable-gpu --no-first-run --no-default-browser-check --disable-crash-reporter --enable-logging=stderr --v=1 --timeout=15000'
                EmitDetail 'P0 --timeout forced dump output; DUMP_BASE carries --timeout=15000'
              }
              $cdpScript = Join-Path (Get-Location).Path 'probe/cdp-dump.ps1'
              $cdpOut = Join-Path $env:SPIKE 'p0-cdp.html'
              & $cdpScript -App $app -Url 'about:blank' -OutFile $cdpOut -Base $heliumBase -Profile (Join-Path $env:SPIKE 'profiles\p0-cdp') -Port 9444 -ReadyMs 25000
              $cdpExit = $LASTEXITCODE
              $cdpBytes = -1
              if (Test-Path $cdpOut) { $cdpBytes = (Get-Item $cdpOut).Length }
              EmitDetail "P0 cdp probe exit=$cdpExit domBytes=$cdpBytes"
              if (($cdpExit -eq 0) -and ($cdpBytes -ge 10)) {
                Add-Content -Path $env:GITHUB_ENV -Value 'P0_CDP=ok' -Encoding utf8
                EmitDetail 'P0 CDP path AVAILABLE (P0_CDP=ok); probes fall back to it when dump-dom is empty'
              }
            }
            Add-Content -Path $env:GITHUB_ENV -Value "DUMP_BASE=$chosen" -Encoding utf8
            EmitDetail "P0 chosen DUMP_BASE=$chosen (heliumBytes=$bHelium plainBytes=$bPlain)"
          } catch {
            EmitDetail "P0 error: $($_.Exception.Message)"
          }
          exit 0
      - name: P3a baseline policy dump
        id: p3a
        if: always()
        run: |
          if (-not $env:SPIKE) { $env:SPIKE = Join-Path $env:RUNNER_TEMP 'spike'; New-Item -ItemType Directory -Force -Path $env:SPIKE | Out-Null }
          function EmitDetail([string]$m) {
            $line = "detail: $m"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'details.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          function EmitVerdict([string]$id, [string]$v) {
            $line = "$id verdict: $v"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'verdicts.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          try {
            $exe = Join-Path $env:SPIKE 'pkg\Yandex\browser.exe'
            if (-not (Test-Path $exe)) { throw 'browser.exe missing (P1 did not produce a tree)' }
            # baseline MUST be captured before any policy key is written (reg add runs in P3b)
            $out = Join-Path $env:SPIKE 'p3a-policy-out.txt'
            $err = Join-Path $env:SPIKE 'p3a-policy-err.txt'
            $prof = Join-Path $env:SPIKE 'profiles\p3a'
            $base = @('--headless=new', '--disable-gpu', '--no-first-run', '--no-default-browser-check', '--disable-crash-reporter', '--enable-logging=stderr', '--v=1')
            if ($env:DUMP_BASE) { $base = @($env:DUMP_BASE -split ' ' | Where-Object { $_ }) }
            $argList = $base + @("--user-data-dir=$prof", '--virtual-time-budget=15000', '--dump-dom', 'browser://policy/')
            $p = Start-Process -FilePath $exe -ArgumentList $argList -PassThru -NoNewWindow -WorkingDirectory (Split-Path -Parent $exe) -RedirectStandardOutput $out -RedirectStandardError $err
            $ec = 'running'
            if (-not $p.WaitForExit(45000)) {
              try { $p.Kill($true) } catch { EmitDetail "P3a kill: $($_.Exception.Message)" }
              $null = $p.WaitForExit(5000); $ec = 'killed@45s'
              EmitDetail 'P3a dump exceeded 45s and was killed'
            } else { $ec = $p.ExitCode }
            Stop-Process -Name browser, browser_proxy -Force -ErrorAction SilentlyContinue
            $dom = ''
            if (Test-Path $out) { $dom = Get-Content $out -Raw -ErrorAction SilentlyContinue }
            if ($null -eq $dom) { $dom = '' }
            if (($dom.Length -le 500) -and ($env:P0_CDP -eq 'ok')) {
              EmitDetail 'P3a dump-dom empty; extracting policy page over CDP (spec URL first, then chrome://policy/ which the binary registers)'
              $cdpScript = Join-Path (Get-Location).Path 'probe/cdp-dump.ps1'
              $appDir = (Split-Path -Parent $exe)
              $tries = @(
                @{ Url = 'browser://policy/'; Port = 9455; Ready = 10000 },
                @{ Url = 'chrome://policy/'; Port = 9465; Ready = 30000 },
                @{ Url = 'browser://policy'; Port = 9475; Ready = 10000 }
              )
              foreach ($t in $tries) {
                $cdpOut = Join-Path $env:SPIKE "p3a-cdp-$($t.Port).html"
                & $cdpScript -App $appDir -Url $t.Url -OutFile $cdpOut -Base $base -Profile (Join-Path $env:SPIKE "profiles\p3a-cdp-$($t.Port)") -Port $t.Port -ReadyMs $t.Ready -DriveNav
                $cdpExit = $LASTEXITCODE
                $cdom = $null
                if (Test-Path $cdpOut) { $cdom = Get-Content $cdpOut -Raw -ErrorAction SilentlyContinue }
                if (($null -ne $cdom) -and ($cdom.Length -gt 500)) {
                  $dom = $cdom
                  EmitDetail "P3a cdp url=$($t.Url) dom bytes=$($dom.Length)"
                  break
                }
                EmitDetail "P3a cdp url=$($t.Url) no dom (exit=$cdpExit)"
              }
              if ($dom.Length -le 500) { EmitDetail 'P3a cdp extraction produced no dom' }
            }
            Set-Content -Path (Join-Path $env:SPIKE 'p3a-baseline.txt') -Value $dom -Encoding utf8
            $hasKey = $dom -match 'YandexAliceMsgDisable'
            $pageOk = ($dom -match 'browser://policy') -or ($dom.Length -gt 500)
            EmitDetail "P3a baseline dom bytes=$($dom.Length); exit=$ec; rendered=$pageOk; YandexAliceMsgDisable present=$hasKey (expected False before reg add)"
            $eh = ''
            if (Test-Path $err) { $eh = (@(Get-Content $err -TotalCount 12 -ErrorAction SilentlyContinue) -join ' | ') -replace '\s+', ' ' }
            if ($eh.Length -gt 700) { $eh = $eh.Substring(0, 700) }
            EmitDetail "P3a stderr head=[$eh]"
            if ($hasKey) { EmitDetail 'P3a WARNING: test key already present in the baseline dump; P3b verdict may be unreliable' }
            if (-not $pageOk) { EmitDetail 'P3a WARNING: baseline dump looks empty; browser://policy may not render headless' }
          } catch {
            EmitDetail "P3a error: $($_.Exception.Message)"
          }
          exit 0

      - name: P2 Chrome plus compatibility
        id: p2
        if: always()
        run: |
          if (-not $env:SPIKE) { $env:SPIKE = Join-Path $env:RUNNER_TEMP 'spike'; New-Item -ItemType Directory -Force -Path $env:SPIKE | Out-Null }
          if (-not $env:SEVENZIP) { $env:SEVENZIP = '7z' }
          function EmitVerdict([string]$id, [string]$v) {
            $line = "$id verdict: $v"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'verdicts.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          function EmitDetail([string]$m) {
            $line = "detail: $m"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'details.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          $v = 'FALLBACK - probe did not run'
          try {
            $app = Join-Path $env:SPIKE 'pkg\Yandex'
            $exe = Join-Path $app 'browser.exe'
            if (-not (Test-Path $exe)) { throw 'browser.exe missing (P1 did not produce a tree)' }
            $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
            $rel = Invoke-RestMethod -Headers $h -Uri 'https://api.github.com/repos/bibicadotnet/Chromium_SetDLL/releases/latest' -TimeoutSec 30
            $asset = $rel.assets | Where-Object { $_.name -match 'Chrome.*\.7z$' } | Select-Object -First 1
            if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match '\.7z$|\.zip$' } | Select-Object -First 1 }
            if (-not $asset) { throw 'no Chrome++ asset on the pinned latest release' }
            $assetUrl = $asset.browser_download_url
            EmitDetail "Chrome++ release=$($rel.tag_name) asset=$($asset.name) url=$assetUrl"
            $cpp = Join-Path $env:SPIKE ('chrome_plus' + [IO.Path]::GetExtension($asset.name))
            curl.exe -fsSL --retry 3 --retry-delay 2 -o $cpp $assetUrl
            if ($LASTEXITCODE -ne 0) { throw "Chrome++ download failed curl exit=$LASTEXITCODE" }
            $xd = Join-Path $env:SPIKE 'cpp'
            New-Item -ItemType Directory -Force -Path $xd | Out-Null
            $null = & $env:SEVENZIP x $cpp "-o$xd" -y
            if ($LASTEXITCODE -ne 0) { throw "Chrome++ extract failed exit=$LASTEXITCODE" }
            $dlls = @(Get-ChildItem -Path $xd -Recurse -File -Filter 'version.dll' -ErrorAction SilentlyContinue)
            $dll = $dlls | Where-Object { $_.FullName -like '*\x64\App\*' } | Select-Object -First 1
            if (-not $dll) { $dll = $dlls | Where-Object { $_.FullName -like '*\x64*' } | Select-Object -First 1 }
            if (-not $dll) { throw "no x64 version.dll in Chrome++ archive (dlls found=$($dlls.Count))" }
            EmitDetail "Chrome++ version.dll: $($dll.FullName)"

            function Invoke-Dump([string]$tag) {
              $o = Join-Path $env:SPIKE "p2-$tag-out.txt"
              $e2 = Join-Path $env:SPIKE "p2-$tag-err.txt"
              $prof = Join-Path $env:SPIKE "profiles\$tag"
              $base = @('--headless=new', '--disable-gpu', '--no-first-run', '--no-default-browser-check', '--disable-crash-reporter', '--enable-logging=stderr', '--v=1')
              if ($env:DUMP_BASE) { $base = @($env:DUMP_BASE -split ' ' | Where-Object { $_ }) }
              $argList = $base + @("--user-data-dir=$prof", '--dump-dom', 'about:blank')
              $pr = Start-Process -FilePath $exe -ArgumentList $argList -PassThru -NoNewWindow -WorkingDirectory (Split-Path -Parent $exe) -RedirectStandardOutput $o -RedirectStandardError $e2
              $ec = 'running'
              if (-not $pr.WaitForExit(54000)) {
                try { $pr.Kill($true) } catch { EmitDetail "P2 $tag kill: $($_.Exception.Message)" }
                $null = $pr.WaitForExit(5000); $ec = 'killed@60s'
              } else { $ec = $pr.ExitCode }
              Stop-Process -Name browser, browser_proxy -Force -ErrorAction SilentlyContinue
              $len = -1
              if (Test-Path $o) { $len = (Get-Item $o).Length }
              $eh = ''
              if (Test-Path $e2) { $eh = (@(Get-Content $e2 -TotalCount 10 -ErrorAction SilentlyContinue) -join ' | ') -replace '\s+', ' ' }
              if ($eh.Length -gt 500) { $eh = $eh.Substring(0, 500) }
              EmitDetail "P2 $tag exit=$ec outBytes=$len stderr=[$eh]"
              return $len
            }

            $dllTarget = Join-Path $app 'version.dll'
            $withLen = -1
            Copy-Item -Path $dll.FullName -Destination $dllTarget -Force
            try { $withLen = Invoke-Dump 'with-dll' } catch { EmitDetail "P2 dump with DLL failed: $($_.Exception.Message)" }
            Remove-Item -Path $dllTarget -Force -ErrorAction SilentlyContinue
            $noLen = -1
            try { $noLen = Invoke-Dump 'no-dll' } catch { EmitDetail "P2 dump without DLL failed: $($_.Exception.Message)" }
            EmitDetail "P2 dump-dom output bytes: withDLL=$withLen withoutDLL=$noLen (Helium lesson: version.dll may silence --dump-dom on CI)"

            # chicken-egg: the candidate ini must exist before the portable run
            $iniLines = @(
              '[general]'
              'data_dir=%app%\..\Data'
              'cache_dir=%app%\..\Cache'
              'command_line=--no-first-run --no-default-browser-check'
              'launch_on_startup='
              'launch_on_exit='
              'boss_key='
              'translate_key='
              'show_password=0'
              'win32k=0'
              'ignore_policies=0'
              'policy_key=Portable'
            )
            Set-Content -Path (Join-Path $app 'chrome++.ini') -Value $iniLines -Encoding utf8
            EmitDetail 'candidate chrome++.ini copied next to browser.exe (WITHOUT --disable-component-update)'
            Copy-Item -Path $dll.FullName -Destination $dllTarget -Force
            Add-Content -Path $env:GITHUB_ENV -Value "P2_DLL=$($dll.FullName)" -Encoding utf8

            $parent = Split-Path -Parent $app
            foreach ($d in @('Data', 'Cache')) {
              $tp = Join-Path $parent $d
              if (Test-Path $tp) { Remove-Item -Path $tp -Recurse -Force -ErrorAction SilentlyContinue }
            }
            $bp = Start-Process -FilePath $exe -PassThru -NoNewWindow
            Start-Sleep -Seconds 12
            $alive = -not $bp.HasExited
            $exitCode = 'running'
            if ($bp.HasExited) { $exitCode = $bp.ExitCode }
            $dataOk = Test-Path (Join-Path $parent 'Data')
            $cacheOk = Test-Path (Join-Path $parent 'Cache')
            Stop-Process -Name browser -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            EmitDetail "P2 normal launch: alive=$alive exit=$exitCode Data=$dataOk Cache=$cacheOk parent=$parent"

            $crashed = (-not $alive) -and ($exitCode -ne 'running') -and ($exitCode -ne 0)
            if ($crashed -and (-not $dataOk) -and (-not $cacheOk)) {
              $v = "FALLBACK - browser crashed with version.dll present (exit=$exitCode) and no portable dirs; use --user-data-dir launcher"
            } elseif ($dataOk -or $cacheOk) {
              $v = "PASS - version.dll loads into browser.exe; portable Data=$dataOk Cache=$cacheOk at %app%\..; dump bytes withDLL=$withLen vs withoutDLL=$noLen"
            } else {
              $v = "FALLBACK - browser alive=$alive exit=$exitCode but no portable Data/Cache next to exe; use --user-data-dir launcher"
            }
          } catch {
            $v = "FALLBACK - $($_.Exception.Message)"
          }
          EmitVerdict 'P2' $v
          exit 0

      - name: P2b ini relative data dir
        id: p2b
        if: always()
        run: |
          if (-not $env:SPIKE) { $env:SPIKE = Join-Path $env:RUNNER_TEMP 'spike'; New-Item -ItemType Directory -Force -Path $env:SPIKE | Out-Null }
          function EmitDetail([string]$m) {
            $line = "detail: $m"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'details.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          function EmitVerdict([string]$id, [string]$v) {
            $line = "$id verdict: $v"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'verdicts.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          try {
            $app = Join-Path $env:SPIKE 'pkg\Yandex'
            $exe = Join-Path $app 'browser.exe'
            if (-not (Test-Path $exe)) { throw 'browser.exe missing (P1 did not produce a tree)' }
            $ini = Join-Path $app 'chrome++.ini'
            if (-not (Test-Path $ini)) { throw 'chrome++.ini missing (P2 step did not run)' }
            $iniRaw = Get-Content $ini -Raw
            $clean = -not ($iniRaw -match 'disable-component-update')
            EmitDetail "P2b ini next to browser.exe; no-disable-component-update=$clean"
            if (-not $clean) { throw 'candidate ini contains --disable-component-update (forbidden)' }
            $dllTarget = Join-Path $app 'version.dll'
            if (-not (Test-Path $dllTarget)) {
              if ($env:P2_DLL -and (Test-Path $env:P2_DLL)) { Copy-Item -Path $env:P2_DLL -Destination $dllTarget -Force }
              else { throw 'version.dll unavailable for the P2b relaunch' }
            }
            $parent = Split-Path -Parent $app
            $data = Join-Path $parent 'Data'
            if (Test-Path $data) { Remove-Item -Path $data -Recurse -Force -ErrorAction SilentlyContinue }
            $bp = Start-Process -FilePath $exe -PassThru -NoNewWindow
            Start-Sleep -Seconds 12
            $dataOk = Test-Path $data
            $alive = -not $bp.HasExited
            Stop-Process -Name browser -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            EmitDetail "P2b relaunch alive=$alive; %app%\..\Data exists=$dataOk (resolved path=$data)"
            if (-not $dataOk) { EmitDetail 'P2b WARNING: relative data_dir did not materialize; Task 3 ini needs tuning' }
          } catch {
            EmitDetail "P2b error: $($_.Exception.Message)"
          }
          exit 0

      - name: P3b policy honoring
        id: p3b
        if: always()
        run: |
          if (-not $env:SPIKE) { $env:SPIKE = Join-Path $env:RUNNER_TEMP 'spike'; New-Item -ItemType Directory -Force -Path $env:SPIKE | Out-Null }
          function EmitVerdict([string]$id, [string]$v) {
            $line = "$id verdict: $v"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'verdicts.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          function EmitDetail([string]$m) {
            $line = "detail: $m"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'details.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          $regKey = 'HKLM\SOFTWARE\Policies\YandexBrowser'
          $keyExisted = $false
          $v = 'IGNORED - probe did not run'
          try {
            $app = Join-Path $env:SPIKE 'pkg\Yandex'
            $exe = Join-Path $app 'browser.exe'
            if (-not (Test-Path $exe)) { throw 'browser.exe missing (P1 did not produce a tree)' }
            $dllPath = Join-Path $app 'version.dll'
            if (Test-Path $dllPath) {
              Move-Item -Path $dllPath -Destination "$dllPath.aside" -Force -ErrorAction SilentlyContinue
              EmitDetail 'P3b version.dll moved aside so --dump-dom is not silenced (Helium lesson)'
            }
            $null = & reg.exe query $regKey
            $keyExisted = ($LASTEXITCODE -eq 0)
            EmitDetail "P3b policy key existed before the test: $keyExisted"
            $null = & reg.exe add $regKey /v YandexAliceMsgDisable /t REG_DWORD /d 1 /f
            if ($LASTEXITCODE -ne 0) { throw "reg add failed exit=$LASTEXITCODE" }
            EmitDetail 'P3b reg add HKLM\SOFTWARE\Policies\YandexBrowser YandexAliceMsgDisable=1 (REG_DWORD)'

            $out = Join-Path $env:SPIKE 'p3b-policy-out.txt'
            $err = Join-Path $env:SPIKE 'p3b-policy-err.txt'
            $prof = Join-Path $env:SPIKE 'profiles\p3b'
            $base = @('--headless=new', '--disable-gpu', '--no-first-run', '--no-default-browser-check', '--disable-crash-reporter', '--enable-logging=stderr', '--v=1')
            if ($env:DUMP_BASE) { $base = @($env:DUMP_BASE -split ' ' | Where-Object { $_ }) }
            $argList = $base + @("--user-data-dir=$prof", '--virtual-time-budget=15000', '--dump-dom', 'browser://policy/')
            $p = Start-Process -FilePath $exe -ArgumentList $argList -PassThru -NoNewWindow -WorkingDirectory (Split-Path -Parent $exe) -RedirectStandardOutput $out -RedirectStandardError $err
            $ec = 'running'
            if (-not $p.WaitForExit(45000)) {
              try { $p.Kill($true) } catch { EmitDetail "P3b kill: $($_.Exception.Message)" }
              $null = $p.WaitForExit(5000); $ec = 'killed@45s'
              EmitDetail 'P3b dump exceeded 45s and was killed'
            } else { $ec = $p.ExitCode }
            Stop-Process -Name browser, browser_proxy -Force -ErrorAction SilentlyContinue
            $dom = ''
            if (Test-Path $out) { $dom = Get-Content $out -Raw -ErrorAction SilentlyContinue }
            if ($null -eq $dom) { $dom = '' }
            if (($dom.Length -le 500) -and ($env:P0_CDP -eq 'ok')) {
              EmitDetail 'P3b dump-dom empty; extracting policy page over CDP (spec URL first, then chrome://policy/ which the binary registers)'
              $cdpScript = Join-Path (Get-Location).Path 'probe/cdp-dump.ps1'
              $appDir = $app
              $tries = @(
                @{ Url = 'browser://policy/'; Port = 9456; Ready = 10000 },
                @{ Url = 'chrome://policy/'; Port = 9466; Ready = 30000 },
                @{ Url = 'browser://policy'; Port = 9476; Ready = 10000 }
              )
              foreach ($t in $tries) {
                $cdpOut = Join-Path $env:SPIKE "p3b-cdp-$($t.Port).html"
                & $cdpScript -App $appDir -Url $t.Url -OutFile $cdpOut -Base $base -Profile (Join-Path $env:SPIKE "profiles\p3b-cdp-$($t.Port)") -Port $t.Port -ReadyMs $t.Ready -DriveNav
                $cdpExit = $LASTEXITCODE
                $cdom = $null
                if (Test-Path $cdpOut) { $cdom = Get-Content $cdpOut -Raw -ErrorAction SilentlyContinue }
                if (($null -ne $cdom) -and ($cdom.Length -gt 500)) {
                  $dom = $cdom
                  EmitDetail "P3b cdp url=$($t.Url) dom bytes=$($dom.Length)"
                  break
                }
                EmitDetail "P3b cdp url=$($t.Url) no dom (exit=$cdpExit)"
              }
              if ($dom.Length -le 500) { EmitDetail 'P3b cdp extraction produced no dom' }
            }
            Set-Content -Path (Join-Path $env:SPIKE 'p3b-policy.txt') -Value $dom -Encoding utf8

            $honored = $dom -match 'YandexAliceMsgDisable'
            $keyLines = @($dom -split "\r?\n" | Where-Object { $_ -match 'YandexAliceMsgDisable' } | ForEach-Object { $_.Trim() } | Select-Object -First 3)
            $evidence = ($keyLines -join ' || ')
            if ($evidence.Length -gt 400) { $evidence = $evidence.Substring(0, 400) }
            EmitDetail "P3b policy dump bytes=$($dom.Length); exit=$ec; matching lines=$($keyLines.Count)"
            $eh = ''
            if (Test-Path $err) { $eh = (@(Get-Content $err -TotalCount 12 -ErrorAction SilentlyContinue) -join ' | ') -replace '\s+', ' ' }
            if ($eh.Length -gt 700) { $eh = $eh.Substring(0, 700) }
            EmitDetail "P3b stderr head=[$eh]"
            if ($honored) { EmitDetail "P3b evidence: $evidence" }
            else { EmitDetail 'P3b key not present in the browser://policy dump' }

            $alm = @($dom -split "\r?\n" | Where-Object { $_ -match 'YandexAutoLaunchMode' } | ForEach-Object { $_.Trim() } | Select-Object -First 3)
            if ($alm.Count -gt 0) { EmitDetail "P3b YandexAutoLaunchMode lines: $(($alm -join ' || ').Substring(0, [Math]::Min(400, ($alm -join ' || ').Length)))" }
            else { EmitDetail 'P3b YandexAutoLaunchMode absent from the dump (browser://policy only lists registered keys)' }
            try {
              $admxUrl = 'https://download.cdn.yandex.net/browser/corporate/YandexBrowser.admx'
              $admx = (Invoke-WebRequest -Uri $admxUrl -UseBasicParsing -TimeoutSec 30).Content
              $idx = $admx.IndexOf('YandexAutoLaunchMode')
              if ($idx -ge 0) {
                $chunk = ($admx.Substring($idx, [Math]::Min(900, $admx.Length - $idx)) -replace '\s+', ' ')
                EmitDetail "P3b ADMX enum evidence: $chunk"
              } else {
                EmitDetail 'P3b ADMX has no YandexAutoLaunchMode entry'
              }
            } catch {
              EmitDetail "P3b ADMX fetch failed: $($_.Exception.Message)"
            }

            if ($honored) {
              $v = "HONORED - YandexAliceMsgDisable listed in browser://policy after reg add (evidence: $evidence)"
            } else {
              $v = "IGNORED - YandexAliceMsgDisable absent from browser://policy after reg add (dump bytes=$($dom.Length))"
            }
          } catch {
            $v = "IGNORED - probe error: $($_.Exception.Message)"
          } finally {
            $null = & reg.exe delete $regKey /v YandexAliceMsgDisable /f
            $valueGone = ($LASTEXITCODE -eq 0)
            $removedKey = $false
            if (-not $keyExisted) {
              $null = & reg.exe delete $regKey /f
              $removedKey = ($LASTEXITCODE -eq 0)
            }
            EmitDetail "P3b cleanup: test value removed=$valueGone; whole key removed=$removedKey"
          }
          EmitVerdict 'P3' $v
          exit 0

      - name: P4 EME probe
        id: p4
        if: always()
        run: |
          if (-not $env:SPIKE) { $env:SPIKE = Join-Path $env:RUNNER_TEMP 'spike'; New-Item -ItemType Directory -Force -Path $env:SPIKE | Out-Null }
          function EmitVerdict([string]$id, [string]$v) {
            $line = "$id verdict: $v"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'verdicts.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          function EmitDetail([string]$m) {
            $line = "detail: $m"
            Write-Host $line
            Add-Content -Path (Join-Path $env:SPIKE 'details.txt') -Value $line -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8
          }
          $v = 'FAIL - probe did not run'
          try {
            $app = Join-Path $env:SPIKE 'pkg\Yandex'
            $exe = Join-Path $app 'browser.exe'
            if (-not (Test-Path $exe)) { throw 'browser.exe missing (P1 did not produce a tree)' }
            $dllPath = Join-Path $app 'version.dll'
            if (Test-Path $dllPath) {
              Move-Item -Path $dllPath -Destination "$dllPath.aside" -Force -ErrorAction SilentlyContinue
              EmitDetail 'P4 version.dll moved aside so --dump-dom is not silenced (Helium lesson)'
            }
            $cdm = Join-Path $app 'WidevineCdm'
            if (-not (Test-Path $cdm)) {
              if ($env:CDM_SRC -and (Test-Path $env:CDM_SRC)) {
                Copy-Item -Path $env:CDM_SRC -Destination $app -Recurse -Force
                EmitDetail "P4 copied WidevineCdm flat from $($env:CDM_SRC) (flat exe-dir rule)"
              } else {
                EmitDetail 'P4 no WidevineCdm shipped next to browser.exe (CDM_SRC unset); EME likely fails'
              }
            }
            $abs = ((Resolve-Path 'probe\eme-probe.html').Path) -replace '\\', '/'
            $uri = "file:///$abs"
            EmitDetail "P4 probe uri=$uri"
            $out = Join-Path $env:SPIKE 'p4-out.txt'
            $err = Join-Path $env:SPIKE 'p4-err.txt'
            $prof = Join-Path $env:SPIKE 'profiles\p4'
            $base = @('--headless=new', '--disable-gpu', '--no-first-run', '--no-default-browser-check', '--disable-crash-reporter', '--enable-logging=stderr', '--v=1')
            if ($env:DUMP_BASE) { $base = @($env:DUMP_BASE -split ' ' | Where-Object { $_ }) }
            $argList = $base + @("--user-data-dir=$prof", '--virtual-time-budget=30000', '--dump-dom', $uri)
            $p = Start-Process -FilePath $exe -ArgumentList $argList -PassThru -NoNewWindow -WorkingDirectory (Split-Path -Parent $exe) -RedirectStandardOutput $out -RedirectStandardError $err
            $ec = 'running'
            if (-not $p.WaitForExit(60000)) {
              try { $p.Kill($true) } catch { EmitDetail "P4 kill: $($_.Exception.Message)" }
              $null = $p.WaitForExit(5000); $ec = 'killed@60s'
              EmitDetail 'P4 exceeded 60s and was killed'
            } else { $ec = $p.ExitCode }
            Stop-Process -Name browser, browser_proxy -Force -ErrorAction SilentlyContinue
            $dom = ''
            if (Test-Path $out) { $dom = Get-Content $out -Raw -ErrorAction SilentlyContinue }
            if ($null -eq $dom) { $dom = '' }
            if (($dom.Length -le 500) -and ($env:P0_CDP -eq 'ok')) {
              EmitDetail 'P4 dump-dom empty; extracting probe page over CDP on the profile holding the downloaded CDM (waits for the <pre id=o> result)'
              $cdpOut = Join-Path $env:SPIKE 'p4-cdp.html'
              & (Join-Path (Get-Location).Path 'probe/cdp-dump.ps1') -App $app -Url $uri -OutFile $cdpOut -Base $base -Profile (Join-Path $env:SPIKE 'profiles\p4') -Port 9457 -ReadyMs 30000 -AwaitExpr '(function(){var p=document.getElementById("o");return p?p.innerText:""})()' -AwaitMs 120000
              if (Test-Path $cdpOut) {
                $cdom = Get-Content $cdpOut -Raw -ErrorAction SilentlyContinue
                if (($null -ne $cdom) -and ($cdom.Length -gt 0)) { $dom = $cdom; EmitDetail "P4 cdp dom bytes=$($dom.Length)" }
              }
              if ($dom.Length -le 500) { EmitDetail 'P4 cdp extraction produced no dom' }
            }
            $eme = 'NO_RESULT'
            if ($dom -match '<title>CDM_OK</title>') { $eme = 'CDM_OK' }
            elseif ($dom -match '(?s)<pre id="o">([^<]+)</pre>') {
              $pre = $Matches[1].Trim()
              if ($pre -ne 'pending' -and $pre -ne '') { $eme = $pre }
            }
            $wv = @()
            if (Test-Path $err) { $wv = @(Get-Content $err -ErrorAction SilentlyContinue | Where-Object { $_ -match 'widevine|CDM' } | Select-Object -First 6) }
            if ($wv.Count -gt 0) { EmitDetail "P4 CDM stderr lines: $(($wv -join ' || '))" }
            else { EmitDetail 'P4 no widevine/CDM lines in stderr' }
            EmitDetail "P4 dom bytes=$($dom.Length); exit=$ec; parsed result=$eme"
            if ($eme -eq 'CDM_OK') { $v = "PASS - CDM_OK from requestMediaKeySystemAccess (domBytes=$($dom.Length))" }
            else { $v = "FAIL - eme=$eme (domBytes=$($dom.Length))" }
          } catch {
            $v = "FAIL - $($_.Exception.Message)"
          }
          EmitVerdict 'P4' $v
          exit 0

      - name: Findings summary
        id: summary
        if: always()
        run: |
          $dir = $env:SPIKE
          if (-not $dir) { $dir = Join-Path $env:RUNNER_TEMP 'spike' }
          $vf = Join-Path $dir 'verdicts.txt'
          $lines = @()
          if (Test-Path $vf) { $lines = @(Get-Content $vf -ErrorAction SilentlyContinue | Where-Object { $_ }) }
          Write-Host '===== spike verdicts ====='
          foreach ($l in $lines) {
            $parts = $l -split ' verdict: ', 2
            if ($parts.Count -eq 2) { Write-Host "$($parts[0]) = $($parts[1])" }
            else { Write-Host $l }
          }
          Write-Host "verdict line count = $($lines.Count) (expected 4)"
          if ($lines.Count -ne 4) { Write-Host 'WARNING: verdict line count is not 4 - check probe steps above' }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Spike verdict lines ($($lines.Count))" -Encoding utf8
          $df = Join-Path $dir 'details.txt'
          if (Test-Path $df) {
            Write-Host '===== spike details ====='
            Get-Content $df -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          }
          exit 0
